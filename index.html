<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muhammad Abid · Cybersecurity Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= ROOT ================= */
  :root{
    --bg:#070a12;
    --bg-2:#0b1120;
    --surface:rgba(17,24,42,0.65);
    --surface-solid:#111827;
    --border:rgba(148,163,184,0.12);
    --border-strong:rgba(148,163,184,0.22);
    --text:#e7ecf5;
    --muted:#8a9bb8;
    --mint:#5eead4;
    --mint-2:#3dd68c;
    --violet:#a78bfa;
    --gold:#fbbf24;
    --grad-1:linear-gradient(135deg,#5eead4 0%,#a78bfa 100%);
    --grad-2:linear-gradient(135deg,#3dd68c 0%,#5eead4 100%);
    --shadow-soft:0 20px 60px -20px rgba(0,0,0,0.7);
    --shadow-glow:0 0 40px rgba(94,234,212,0.15);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Sora',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Animated background */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(800px 600px at 15% -10%, rgba(94,234,212,0.10), transparent 60%),
      radial-gradient(900px 700px at 90% 0%, rgba(167,139,250,0.10), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(61,214,140,0.08), transparent 60%);
    pointer-events:none;
    z-index:0;
    animation:bgPulse 14s ease-in-out infinite alternate;
  }
  @keyframes bgPulse{
    0%{opacity:.75;transform:scale(1)}
    100%{opacity:1;transform:scale(1.08)}
  }

  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .container{
    max-width:1180px;
    margin:0 auto;
    padding:0 1.5rem;
    position:relative;
    z-index:1;
  }

  /* ================= NAVBAR ================= */
  header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    background:rgba(7,10,18,0.72);
    border-bottom:1px solid var(--border);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem 0;
    gap:1rem;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:.6rem;
    font-weight:700;
    letter-spacing:-.02em;
    font-size:1.05rem;
    cursor:pointer;
  }
  .brand-dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--grad-1);
    box-shadow:0 0 14px rgba(94,234,212,0.7);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.25);opacity:.7}
  }
  .brand-text{
    background:var(--grad-2);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  .brand-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--muted);
    margin-left:.2rem;
    font-weight:400;
  }

  .nav-links{
    display:flex;
    gap:.35rem;
    flex-wrap:wrap;
    align-items:center;
  }
  .nav-links a{
    font-family:'JetBrains Mono',monospace;
    font-size:.82rem;
    color:var(--muted);
    padding:.5rem .9rem;
    border-radius:999px;
    transition:all .25s ease;
    cursor:pointer;
    border:1px solid transparent;
  }
  .nav-links a:hover{
    color:var(--mint);
    background:rgba(94,234,212,0.06);
    border-color:rgba(94,234,212,0.2);
  }
  .nav-links a.active{
    color:var(--mint);
    background:rgba(94,234,212,0.10);
    border-color:rgba(94,234,212,0.35);
  }
  .nav-links a.cta{
    color:#0a0f1c;
    background:var(--grad-2);
    font-weight:600;
    border-color:transparent;
    box-shadow:0 6px 20px -8px rgba(94,234,212,0.6);
  }
  .nav-links a.cta:hover{
    color:#0a0f1c;
    transform:translateY(-1px);
    box-shadow:0 10px 28px -8px rgba(94,234,212,0.8);
  }

  /* ================= VIEWS ================= */
  .view{display:none}
  .view.active{display:block;animation:fadeIn .5s ease}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ================= HERO ================= */
  .hero{
    padding:5.5rem 0 4.5rem;
    position:relative;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.25fr 1fr;
    gap:4rem;
    align-items:center;
  }
  .hero-badge{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    font-family:'JetBrains Mono',monospace;
    font-size:.75rem;
    color:var(--mint);
    padding:.45rem 1rem;
    border-radius:999px;
    background:rgba(94,234,212,0.08);
    border:1px solid rgba(94,234,212,0.25);
    margin-bottom:1.4rem;
    letter-spacing:.05em;
  }
  .hero-badge .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 10px var(--mint);
    animation:pulse 2s infinite;
  }
  .hero h1{
    font-size:clamp(2.4rem,5.2vw,4rem);
    font-weight:800;
    line-height:1.05;
    letter-spacing:-.035em;
    margin-bottom:1.1rem;
  }
  .hero h1 .grad{
    background:var(--grad-1);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero-sub{
    font-size:1.08rem;
    color:var(--muted);
    max-width:600px;
    margin-bottom:1.6rem;
  }
  .hero-sub strong{color:var(--text);font-weight:600}

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:.55rem;
    margin-bottom:2rem;
  }
  .tags span{
    font-family:'JetBrains Mono',monospace;
    font-size:.74rem;
    color:#b8c8e0;
    padding:.35rem .8rem;
    border-radius:999px;
    background:rgba(148,163,184,0.06);
    border:1px solid var(--border);
  }

  .actions{
    display:flex;
    gap:.8rem;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    padding:.85rem 1.5rem;
    border-radius:12px;
    font-weight:600;
    font-size:.92rem;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .25s ease;
    font-family:'Sora',sans-serif;
  }
  .btn.primary{
    background:var(--grad-2);
    color:#071210;
    box-shadow:0 10px 30px -10px rgba(94,234,212,0.6);
  }
  .btn.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 40px -12px rgba(94,234,212,0.8);
  }
  .btn.ghost{
    background:rgba(148,163,184,0.05);
    border-color:var(--border-strong);
    color:var(--text);
  }
  .btn.ghost:hover{
    border-color:var(--mint);
    color:var(--mint);
    background:rgba(94,234,212,0.06);
  }
  .btn.gold{
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
    color:#1a1204;
    box-shadow:0 10px 30px -10px rgba(251,191,36,0.5);
  }
  .btn.gold:hover{transform:translateY(-2px)}

  /* Portrait */
  .portrait-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .portrait-glow{
    position:absolute;
    width:80%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:conic-gradient(from 180deg,#5eead4,#a78bfa,#3dd68c,#5eead4);
    filter:blur(60px);
    opacity:.35;
    animation:spin 12s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .portrait{
    position:relative;
    width:min(340px,90%);
    aspect-ratio:1/1;
    border-radius:32px;
    overflow:hidden;
    border:1px solid var(--border-strong);
    background:var(--surface-solid);
    box-shadow:var(--shadow-soft), 0 0 60px -10px rgba(94,234,212,0.25);
  }
  .portrait img{width:100%;height:100%;object-fit:cover}

  .floating-chip{
    position:absolute;
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    padding:.5rem .9rem;
    border-radius:12px;
    background:rgba(17,24,42,0.85);
    backdrop-filter:blur(10px);
    border:1px solid var(--border-strong);
    color:var(--mint);
    box-shadow:var(--shadow-soft);
    animation:float 5s ease-in-out infinite;
  }
  .chip-1{top:8%;left:-6%}
  .chip-2{bottom:12%;right:-6%;color:var(--violet);animation-delay:-2s}
  .chip-3{bottom:42%;left:-10%;color:var(--gold);animation-delay:-4s}
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }

  /* ================= SECTIONS ================= */
  .section{padding:5rem 0;position:relative}
  .section-head{margin-bottom:3rem}
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    color:var(--mint);
    letter-spacing:.15em;
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    margin-bottom:.8rem;
  }
  .kicker::before{
    content:"";
    width:24px;height:1px;
    background:var(--mint);
    display:inline-block;
  }
  .section-head h2{
    font-size:clamp(1.8rem,3.4vw,2.6rem);
    font-weight:700;
    letter-spacing:-.025em;
    line-height:1.15;
  }
  .section-head h2 .grad{
    background:var(--grad-1);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .section-head p{
    color:var(--muted);
    max-width:620px;
    margin-top:.9rem;
    font-size:1rem;
  }

  /* ================= ABOUT ================= */
  .about-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:2.5rem;
    align-items:start;
  }
  .glass{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:1.6rem 1.8rem;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:all .3s ease;
  }
  .glass:hover{
    border-color:var(--border-strong);
    transform:translateY(-2px);
  }
  .about-text p{
    color:#c8d2e6;
    margin-bottom:1.1rem;
    font-size:1rem;
    line-height:1.75;
  }
  .about-text p:last-child{margin-bottom:0}
  .about-text i{
    color:var(--mint);
    margin-right:.6rem;
    width:18px;
    display:inline-block;
  }

  .quick-facts{
    display:flex;
    flex-direction:column;
    gap:1rem;
  }
  .fact{
    display:flex;
    align-items:flex-start;
    gap:.9rem;
    padding:1rem 1.2rem;
    border-radius:16px;
    background:var(--surface);
    border:1px solid var(--border);
    transition:all .25s ease;
  }
  .fact:hover{
    border-color:rgba(94,234,212,0.4);
    transform:translateX(4px);
  }
  .fact .ico{
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(94,234,212,0.08);
    color:var(--mint);
    border:1px solid rgba(94,234,212,0.2);
    flex-shrink:0;
  }
  .fact h4{font-size:.88rem;font-weight:600;margin-bottom:.15rem}
  .fact p{font-size:.82rem;color:var(--muted);font-family:'JetBrains Mono',monospace}

  /* ================= SKILLS ================= */
  .skills-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:1.2rem;
  }
  .skill-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:1.6rem;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:all .3s ease;
    position:relative;
    overflow:hidden;
  }
  .skill-card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(94,234,212,0.5),transparent);
    opacity:0;
    transition:opacity .3s;
  }
  .skill-card:hover::before{opacity:1}
  .skill-card:hover{
    border-color:rgba(94,234,212,0.35);
    transform:translateY(-4px);
    box-shadow:0 20px 40px -20px rgba(94,234,212,0.3);
  }
  .skill-card .skill-head{
    display:flex;align-items:center;gap:.8rem;margin-bottom:1.1rem;
  }
  .skill-card .skill-icon{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--grad-1);
    color:#0a0f1c;font-size:1.1rem;
  }
  .skill-card h3{
    font-size:1rem;font-weight:600;letter-spacing:-.01em;
  }
  .skill-card .skill-list{
    display:flex;flex-wrap:wrap;gap:.45rem;
  }
  .skill-card .skill-list span{
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    color:#c8d2e6;
    padding:.35rem .75rem;
    border-radius:8px;
    background:rgba(148,163,184,0.06);
    border:1px solid var(--border);
    transition:all .2s;
  }
  .skill-card .skill-list span:hover{
    color:var(--mint);
    border-color:rgba(94,234,212,0.4);
    background:rgba(94,234,212,0.06);
  }

  /* ================= PROJECTS ================= */
  .projects-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:1.5rem;
  }
  .project{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:1.8rem;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:all .35s ease;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .project::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:22px;
    background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),rgba(94,234,212,0.08),transparent 40%);
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
  }
  .project:hover::after{opacity:1}
  .project:hover{
    border-color:rgba(94,234,212,0.4);
    transform:translateY(-6px);
    box-shadow:0 30px 60px -30px rgba(94,234,212,0.35);
  }
  .project .proj-icon{
    width:50px;height:50px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(94,234,212,0.08);
    color:var(--mint);
    border:1px solid rgba(94,234,212,0.25);
    font-size:1.25rem;
    margin-bottom:1.1rem;
  }
  .project h3{
    font-size:1.1rem;
    font-weight:600;
    margin-bottom:.6rem;
    letter-spacing:-.01em;
  }
  .project p{
    color:var(--muted);
    font-size:.92rem;
    line-height:1.65;
    margin-bottom:1.2rem;
    flex:1;
  }
  .project .stack{
    display:flex;flex-wrap:wrap;gap:.4rem;
    padding-top:1rem;
    border-top:1px solid var(--border);
    margin-bottom:1rem;
  }
  .project .stack span{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    color:#b8c8e0;
    padding:.25rem .65rem;
    border-radius:6px;
    background:rgba(148,163,184,0.06);
    border:1px solid var(--border);
  }
  .project .proj-link{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    font-family:'JetBrains Mono',monospace;
    font-size:.8rem;
    color:var(--mint);
    padding:.55rem 1rem;
    border-radius:10px;
    background:rgba(94,234,212,0.06);
    border:1px solid rgba(94,234,212,0.25);
    transition:all .25s;
    align-self:flex-start;
  }
  .project .proj-link:hover{
    background:rgba(94,234,212,0.14);
    transform:translateX(3px);
  }

  /* ================= CERTIFICATIONS ================= */
  .certs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:1.2rem;
  }
  .cert{
    display:flex;
    align-items:center;
    gap:1.1rem;
    padding:1.4rem 1.5rem;
    border-radius:18px;
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:all .3s ease;
    position:relative;
    overflow:hidden;
  }
  .cert::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:3px;
    background:linear-gradient(180deg,var(--gold),#f59e0b);
    transform:scaleY(0);
    transition:transform .3s;
    transform-origin:top;
  }
  .cert:hover::before{transform:scaleY(1)}
  .cert:hover{
    border-color:rgba(251,191,36,0.35);
    transform:translateY(-3px);
    box-shadow:0 20px 40px -25px rgba(251,191,36,0.4);
  }
  .cert .cert-icon{
    width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(251,191,36,0.08);
    color:var(--gold);
    border:1px solid rgba(251,191,36,0.25);
    font-size:1.3rem;
    flex-shrink:0;
  }
  .cert h3{font-size:.98rem;font-weight:600;margin-bottom:.3rem;line-height:1.3}
  .cert p{
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    color:var(--muted);
  }
  .cert .badge{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    margin-top:.45rem;
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    color:var(--mint);
    padding:.2rem .6rem;
    border-radius:999px;
    background:rgba(94,234,212,0.08);
    border:1px solid rgba(94,234,212,0.25);
  }

  /* ================= CONTACT ================= */
  .contact-card{
    background:linear-gradient(135deg,rgba(94,234,212,0.08),rgba(167,139,250,0.08));
    border:1px solid var(--border-strong);
    border-radius:28px;
    padding:3rem 2.5rem;
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:2rem;
    align-items:center;
    position:relative;
    overflow:hidden;
  }
  .contact-card::before{
    content:"";
    position:absolute;
    width:400px;height:400px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(94,234,212,0.15),transparent 70%);
    top:-150px;right:-100px;
  }
  .contact-card h2{
    font-size:clamp(1.6rem,3vw,2.2rem);
    font-weight:700;
    letter-spacing:-.02em;
    margin-bottom:.6rem;
  }
  .contact-card p{color:var(--muted);font-size:.98rem}
  .contact-actions{display:flex;flex-direction:column;gap:.8rem;position:relative;z-index:1}

  .socials{
    display:flex;justify-content:center;gap:1rem;
    margin-top:3rem;
  }
  .socials a{
    width:48px;height:48px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:1.15rem;
    transition:all .3s ease;
    backdrop-filter:blur(10px);
  }
  .socials a:hover{
    color:var(--mint);
    border-color:rgba(94,234,212,0.5);
    transform:translateY(-4px);
    box-shadow:0 12px 30px -12px rgba(94,234,212,0.5);
  }

  footer{
    text-align:center;
    padding:2.5rem 1rem;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    border-top:1px solid var(--border);
    margin-top:3rem;
  }
  footer .heart{color:var(--mint)}

  /* ============================================================
     =================== CV VIEW =================================
     ============================================================ */
  .cv-shell{
    max-width:920px;
    margin:3rem auto;
    background:#fbfcfe;
    color:#1a2233;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7);
  }
  .cv-top{
    background:linear-gradient(135deg,#0d1526,#131e33);
    color:#e7ecf5;
    padding:2.5rem 2.5rem 2rem;
    display:flex;
    gap:2rem;
    align-items:center;
    flex-wrap:wrap;
  }

    }
    .cv-id h1{color:#111}

    .cv-contact a, .cv-contact span{color:#333}
    .cv-contact i{color:#0d7a55}
    .cv-sec{page-break-inside:avoid}
    .cv-project{page-break-inside:avoid}
    .cv-cert{page-break-inside:avoid}
  }
